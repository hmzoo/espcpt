; ============================================================
;  PlatformIO - Projet "Compte-tours moteur 220 V"
;  Carte : NodeMCU v2 (Amica) - ESP8266EX / module ESP-12E
; ============================================================
;  Documentation : voir README.md et docs/wiring.md
; ============================================================
;  Environnements :
;    - nodemcuv2  : firmware principal (src/main.cpp)
;    - oled_test  : test de l'écran (src/oled_test.cpp)
;    - input_test : test des boutons + capteur (src/input_test.cpp)
; ============================================================

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform  = espressif8266
board     = nodemcuv2
framework = arduino

; --- Liaison série (pont USB CP2102) ---
upload_speed  = 115200
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder

; --- Ne pas compiler les sketches de test dans cet environnement ---
build_src_filter = +<*> -<oled_test.cpp> -<input_test.cpp>

; --- Bibliothèques ---
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.16.1

; --- Options de compilation ---
build_flags =
    -Wall
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

; --- Flash 4 Mo (identique au composant détecté) ---
board_build.flash_size = 4MB


; ============================================================
;  Environnement de TEST de l'écran OLED uniquement
;  Utilisation :
;    pio run -e oled_test -t upload
;    pio device monitor -e oled_test
; ============================================================
[env:oled_test]
platform  = espressif8266
board     = nodemcuv2
framework = arduino

upload_speed  = 115200
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder

; --- Ne compiler que le sketch de test écran ---
build_src_filter = +<*> -<main.cpp> -<input_test.cpp>

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.16.1

build_flags =
    -Wall

board_build.flash_size = 4MB


; ============================================================
;  Environnement de TEST des ENTREES (boutons + capteur)
;  Utilisation :
;    pio run -e input_test -t upload
;    pio device monitor -e input_test
; ============================================================
[env:input_test]
platform  = espressif8266
board     = nodemcuv2
framework = arduino

upload_speed  = 115200
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder

; --- Ne compiler que le sketch de test des entrées ---
build_src_filter = +<*> -<main.cpp> -<oled_test.cpp>

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.16.1

build_flags =
    -Wall

board_build.flash_size = 4MB
